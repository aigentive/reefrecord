[package]
name = "reef-recorder"
version = "0.1.0"
description = "Reef Recorder — desktop recorder and Gemini transcription"
authors = ["Reef Recorder"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "reef_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
hound = "3"
flacenc = { version = "0.5.1", default-features = false }
claxon = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
base64 = "0.22"
which = "7"
tempfile = "3"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
